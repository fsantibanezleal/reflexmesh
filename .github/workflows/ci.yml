name: Engine CI
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo fmt --check
      - run: python -m pip install '.[dev]'
      - name: Native and actual runtime contracts
        run: python -m pytest tests/test_native_broker.py tests/test_runtime.py tests/test_planners.py tests/test_controller.py tests/test_processes.py
  scientific:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install '.[train,server,mcp,dev]'
      - run: python -m pytest
  distributions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install built wheel outside source checkout
        shell: bash
        run: |
          python -m venv wheel-test
          if [ -f wheel-test/Scripts/python.exe ]; then py=wheel-test/Scripts/python.exe; else py=wheel-test/bin/python; fi
          "$py" -m pip install dist/*.whl
          "$py" -I -c 'from reflexmesh import _native; from reflexmesh.runtime import Runtime; assert _native.__engine__ == "rust-pyo3"; print(_native.__version__)'
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
