name: Engine CI
on:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_ci_budget.py
      - run: python scripts/check_sdd.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo fmt --check
      - run: python -m pip install '.[dev]'
      - name: Library runtime contracts without training dependencies
        run: python -m pytest tests/test_native_broker.py tests/test_runtime.py tests/test_planners.py tests/test_controller.py tests/test_processes.py
      - name: No em-dash and no emoji in tracked content (ADR-0067)
        run: python scripts/check_content_standards.py
