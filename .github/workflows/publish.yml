name: Publish Python distribution
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install cibuildwheel build
      - name: Build portable platform wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: 'cp311-* cp312-* cp313-*'
          CIBW_SKIP: '*-musllinux_* *-win32 *-manylinux_i686'
          CIBW_TEST_COMMAND: 'python -c "from reflexmesh import _native; assert _native.__engine__ == ''rust-pyo3''"'
          CIBW_BEFORE_ALL_LINUX: 'curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal'
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
      - name: Build source distribution
        if: runner.os == 'Linux'
        run: python -m build --sdist --outdir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: wheelhouse/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/reflexmesh
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
